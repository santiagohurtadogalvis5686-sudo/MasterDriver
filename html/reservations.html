<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterDriver | Reservas</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/png" href="/static/logo.png">
</head>

<body>

<header class="navbar">

    <a href="/index.html" class="logo">
        MASTER<span>DRIVER</span>
    </a>

    <nav class="nav-links">
        <a href="/index.html">Inicio</a>
        <a href="/html/catalog.html">Catálogo</a>
        <a href="/html/my-publications.html">Mis Publicaciones</a>
        <a href="/html/publish.html">Publicar vehículo</a>
        <a href="/html/profile.html">Perfil</a>
        <a href="/html/reservations.html" class="active">Reservaciones</a>
        <a href="/html/Cartera.html">Mi Cartera</a>
        <div id="authNavContainer" class="auth-buttons">
            <!-- Se inyecta dinámicamente por JS -->
        </div>
    </nav>

    <button id="logoutButton" class="btn btn-primary" type="button">
        Cerrar sesión
    </button>

</header>

<main class="page-container">

    <section class="page-header">

        <span class="section-label">
            PANEL
        </span>

        <h1>
            Mis reservas
        </h1>

        <p>
            Consulta las solicitudes y reservas realizadas.
        </p>

    </section>

    <div id="reservationAlertContainer"></div>

    <section class="dashboard-stats">

        <div class="stat-card">
            <span>Reservas Activas</span>
            <strong id="totalReservations">0</strong>
        </div>

        <div class="stat-card">
            <span>Pendientes</span>
            <strong id="pendingReservations">0</strong>
        </div>

        <div class="stat-card">
            <span>Confirmadas</span>
            <strong id="confirmedReservations">0</strong>
        </div>

    </section>

    <section
        id="reservationFormSection"
        class="reservation-list"
        hidden
    >

        <div class="section-heading-small">
            <h2>Confirmar reserva</h2>
        </div>

        <p id="selectedVehicleInfo" style="font-weight: bold; font-size: 1.1rem; color: #333;"></p>

        <div style="margin: 15px 0; display: flex; flex-direction: column; gap: 12px; max-width: 400px;">
            <label style="display: flex; flex-direction: column; gap: 5px; font-weight: bold;">
                Fecha y Hora de Inicio:
                <input type="datetime-local" id="clientFechaInicio" class="form-control" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </label>

            <label style="display: flex; flex-direction: column; gap: 5px; font-weight: bold;">
                Fecha y Hora de Fin:
                <input type="datetime-local" id="clientFechaFin" class="form-control" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </label>
        </div>

        <p id="reservationTotal" style="font-size: 1.2rem; font-weight: bold; color: #2b6cb0;">
            Total estimado: $0 COP
        </p>

        <p id="reservationFormMessage"></p>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button
                id="confirmReservationButton"
                class="btn btn-primary"
                type="button"
            >
                Confirmar reserva
            </button>

            <button
                id="cancelFormButton"
                type="button"
                class="btn btn-secondary"
            >
                Cancelar
            </button>
        </div>

    </section>

    <section class="reservation-list">

        <div class="section-heading-small">
            <h2>Actividad reciente</h2>
        </div>

        <div id="reservationContainer">
            Cargando reservas...
        </div>

    </section>

</main>

<script src="/js/app.js"></script>
<script src="/js/reservations.js"></script>

</body>
</html>
